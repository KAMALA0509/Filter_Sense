<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FilterSense – Hardware Demo (matched to assembly model)</title>
<style>
:root{--bg:#e9edf0;--fg:#223}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--fg:#dde}}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
canvas{width:100%;max-width:1100px;aspect-ratio:16/9;border-radius:8px;background:#dfe5ea}
.bar{width:100%;max-width:1100px;display:flex;gap:10px;align-items:center;margin-top:8px}
button{padding:6px 14px;border-radius:6px;border:1px solid #889;background:transparent;color:inherit;cursor:pointer}
#p{flex:1;height:4px;background:#8894;border-radius:2px}#pi{height:4px;width:0;background:#2a8;border-radius:2px}
</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<div class="bar"><button id="b">Replay</button><div id="p"><div id="pi"></div></div><span id="tt">0.0s / 30s</span></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const KF=[[0,560,360,1],[5,700,360,1],[6.5,330,450,2.1],[9,340,440,2],[11.5,900,330,1.9],[12.5,460,310,1.8],[16.5,470,300,1.9],[17.5,1120,125,3],[21.5,1120,125,3],[22.5,580,360,1.5],[27,600,360,1.4],[29,640,360,1],[30,640,360,1]];
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),sm=v=>v*v*(3-2*v),lerp=(a,b,k)=>a+(b-a)*k;
function cam(t){for(let i=0;i<KF.length-1;i++){const a=KF[i],b=KF[i+1];if(t<=b[0]){const k=sm(clamp((t-a[0])/(b[0]-a[0]||1)));return[lerp(a[1],b[1],k),lerp(a[2],b[2],k),lerp(a[3],b[3],k)]}}return KF[KF.length-1].slice(1)}
const rr=(a,b,w,h,r)=>{x.beginPath();x.roundRect(a,b,w,h,r)};
const PATH=[[230,600],[300,600],[300,300],[445,300],[445,620],[625,620],[625,145],[900,145],[900,600],[980,600]];
const CUM=[0];for(let i=1;i<PATH.length;i++)CUM.push(CUM[i-1]+Math.hypot(PATH[i][0]-PATH[i-1][0],PATH[i][1]-PATH[i-1][1]));
const L=CUM[CUM.length-1];
function at(s){let i=1;while(i<CUM.length-1&&CUM[i]<s)i++;const k=(s-CUM[i-1])/(CUM[i]-CUM[i-1]);return[lerp(PATH[i-1][0],PATH[i][0],k),lerp(PATH[i-1][1],PATH[i][1],k)]}
const parts=Array.from({length:110},(_,i)=>i/110*L);
const SENS=[[300,560,'TDS IN'],[300,470,'TURBIDITY'],[300,370,'P1'],[625,255,'P2'],[900,255,'FLOW'],[900,400,'TDS OUT']];
let t0=0,run=false,phase=0,lastT=0;
function lcd(px,py,txt,w=66){rr(px,py,w,22,3);x.fillStyle='#10201a';x.fill();x.strokeStyle='#556';x.lineWidth=1.5;x.stroke();x.fillStyle='#5fffa0';x.font='bold 12px monospace';x.textAlign='center';x.fillText(txt,px+w/2,py+16)}
function label(px,py,s,col='#2a3b4a',sz=11){x.fillStyle=col;x.font='bold '+sz+'px monospace';x.textAlign='center';x.fillText(s,px,py)}
function trace(){x.beginPath();PATH.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.lineJoin='round'}
function draw(t,dt){
 const c=sm(clamp((t-14)/14)),flow=1-.8*c,P1=3.2+1.4*c,P2=3.1-1.1*c;
 x.setTransform(1,0,0,1,0,0);
 let g=x.createLinearGradient(0,0,0,720);g.addColorStop(0,'#eef2f5');g.addColorStop(1,'#c4ccd2');x.fillStyle=g;x.fillRect(0,0,1280,720);
 const [cx,cy,z]=cam(t);x.setTransform(z,0,0,z,640-cx*z,360-cy*z);
 rr(40,20,1200,620,4);x.fillStyle='#cdd5db';x.fill();rr(40,640,1200,34,3);x.fillStyle='#738d9a';x.fill();
 // electronics box
 rr(1000,36,240,148,6);x.fillStyle='#3b7f90';x.fill();rr(1000,36,240,16,4);x.fillStyle='#275c6e';x.fill();
 rr(1014,60,212,112,4);x.fillStyle='#14233a';x.fill();
 rr(1085,74,80,56,3);x.fillStyle='#bbb';x.fill();label(1125,107,'ESP32','#222',13);
 const blink=Math.floor(t*2)%2==0,amber=c>.75;
 x.fillStyle=blink?(amber?'#ffb000':'#2f6'):'#243';x.beginPath();x.arc(1032,78,6,0,7);x.fill();
 x.fillStyle=Math.random()<.5?'#48f':'#124';x.beginPath();x.arc(1052,78,5,0,7);x.fill();
 lcd(1160,66,'WiFi OK',56);
 const pins=SENS.map((s,i)=>1030+i*32);
 pins.forEach(p=>{x.fillStyle='#d4af37';x.fillRect(p-4,172,8,12)});
 // wires
 const wc=['#e33','#e90','#2b4','#28d','#a4d','#0bb'];
 SENS.forEach((s,i)=>{for(const[o,w,col]of[[0,3,wc[i]],[5,2,'#222']]){x.beginPath();x.moveTo(s[0]+o,s[1]);x.bezierCurveTo(s[0]+o+90,s[1]-110-i*14,pins[i]+o,260+i*12,pins[i]+o,184);x.strokeStyle=col;x.lineWidth=w;x.stroke()}});
 // tank
 rr(70,330,160,310,6);x.fillStyle='#7bbcd6';x.fill();rr(76,380+20*Math.sin(t*2),148,254,4);x.fillStyle='rgba(40,130,210,.55)';x.fill();label(150,360,'FEED TANK','#124',12);
 // housings
 const sed=[lerp(232,107,c),lerp(228,74,c),lerp(216,43,c)].map(Math.round);
 const hous=(cx2,col,name)=>{rr(cx2-46,320,92,320,10);x.fillStyle='rgba(205,225,238,.55)';x.fill();x.strokeStyle='#7c94a4';x.lineWidth=3;x.stroke();rr(cx2-36,335,72,290,6);x.fillStyle=col;x.fill();x.fillStyle='rgba(255,255,255,.28)';x.fillRect(cx2-30,340,6,280);rr(cx2-52,306,104,22,8);x.fillStyle='#68a7b5';x.fill();label(cx2,658,name,'#eef',11)};
 hous(445,`rgb(${sed})`,'SEDIMENT');hous(625,'#2a2a2e','ACTIVATED CARBON');
 // RO
 rr(400,105,530,80,16);x.fillStyle='rgba(90,163,179,.7)';x.fill();x.strokeStyle='#3a7c8c';x.lineWidth=3;x.stroke();
 for(let i=0;i<12;i++){x.fillStyle='rgba(255,255,255,.18)';x.fillRect(430+i*40,112,8,66)}
 label(665,98,'RO MEMBRANE','#124',12);
 // pipe + water
 trace();x.strokeStyle='#8fa6b5';x.lineWidth=17;x.stroke();trace();x.strokeStyle='#e6f1f7';x.lineWidth=13;x.stroke();
 trace();x.strokeStyle='rgba(30,120,205,.85)';x.lineWidth=3+9*flow;x.stroke();
 x.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<parts.length;i++){parts[i]=(parts[i]+flow*140*dt)%L;const[p,q]=at(parts[i]);x.beginPath();x.arc(p,q,1.8,0,7);x.fill()}
 // sensors
 SENS.forEach(([px,py,n],i)=>{
  const pr=n[0]=='P',col=pr?'#b87333':'#c9a77c';
  rr(px-13,py-11,26,22,3);x.fillStyle=col;x.fill();x.strokeStyle='#445';x.lineWidth=1.5;x.stroke();
  rr(px-8,py-30,16,19,3);x.fillStyle='#2b2b30';x.fill();
  if(n=='FLOW'){x.fillStyle='#d6c040';x.beginPath();x.arc(px,py,17,0,7);x.fill();x.stroke();phase+=flow*dt*14;x.save();x.translate(px,py);x.rotate(phase);x.strokeStyle='#223';x.lineWidth=3;for(let k=0;k<3;k++){x.rotate(Math.PI*2/3);x.beginPath();x.lineTo(0,0);x.lineTo(11,0);x.stroke()}x.restore()}
  const v=[Math.round(420)+' ppm',(1.1+.4*c).toFixed(1)+' NTU',P1.toFixed(2)+' bar',P2.toFixed(2)+' bar',(4-3.2*c).toFixed(1)+' L/m',Math.round(18+8*c)+' ppm'][i];
  lcd(px+18,py-12,v,70);label(px+53,py-18,n,'#2a3b4a',10);
 });
 lcd(500,210,'dP '+(P1-P2).toFixed(2)+' bar',96);
 label(980,625,'OUTLET','#124',11);
}
function frame(now){
 if(!run)return;const t=(now-t0)/1000,dt=Math.min(.05,t-lastT);lastT=t;
 const tt=Math.min(t,30);draw(tt,Math.max(dt,0));
 document.getElementById('pi').style.width=tt/30*100+'%';document.getElementById('tt').textContent=tt.toFixed(1)+'s / 30s';
 if(t<30)requestAnimationFrame(frame);else run=false;
}
function start(){t0=performance.now();lastT=0;run=true;requestAnimationFrame(frame)}
document.getElementById('b').onclick=start;start();
</script></body></html>
